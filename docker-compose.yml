services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
      POSTGRES_DB: shop
    ports:
      - "${DB_PORT:-5434}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shop"]
      interval: 2s
      timeout: 3s
      retries: 15

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://shop:shop@db:5432/shop
    depends_on:
      db:
        condition: service_healthy

  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://shop:shop@db:5432/shop
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-dev-webhook-secret}
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Cancels payments still pending after 24 hours, hourly. In production, schedule
  # `flask cancel-stale-payments` with the platform's scheduler instead.
  cancel-stale-payments:
    build: .
    command:
      - sh
      - -c
      - >-
        while true; do flask --app app:create_app cancel-stale-payments;
        sleep 3600; done
    init: true
    environment:
      DATABASE_URL: postgresql+psycopg://shop:shop@db:5432/shop
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-dev-webhook-secret}
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  db-data:
