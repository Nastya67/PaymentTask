[project]
name = "paymentendpoint"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "flask>=3.1.3",
    "flask-login>=0.6.3",
    "gunicorn>=26.2.0",
    "psycopg[binary]>=3.3.6",
    "sqlalchemy>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.alembic]
script_location = "%(here)s/migrations"
prepend_sys_path = ["."]
